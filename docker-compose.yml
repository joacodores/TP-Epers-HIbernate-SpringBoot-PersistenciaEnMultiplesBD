version: '3.9'

services:

  redis:
    image: redis:8.4-rc1-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "no" ]
    networks:
      - cache-net

networks:
  cache-net:
    driver: bridge
